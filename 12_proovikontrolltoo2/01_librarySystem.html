<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let library = null;
        let exports = {};
        function startPage() {
            library = new Library();
            showItems();
        }

        function updateForm() {
            const type = document.getElementById("type").value;
            document.getElementById("book-fields").style.display = type === "book" ? "" : "none";
            document.getElementById("dvd-fields").style.display = type === "dvd" ? "" : "none";
        }
        function addItem() {
            const type = document.getElementById("type").value;
            let item;
            try {
                if (type === "book") {
                    item = new Book(
                        document.getElementById("id").value,
                        document.getElementById("title").value,
                        document.getElementById("author").value,
                        Number(document.getElementById("year").value),
                        Number(document.getElementById("pages").value),
                        document.getElementById("ISBN").value,
                    )
                } else {
                    item = new Dvd(
                        document.getElementById("id").value,
                        document.getElementById("title").value,
                        document.getElementById("author").value,
                        Number(document.getElementById("year").value),
                        Number(document.getElementById("duration").value),
                    )
                }
                library.addItem(item);
                showItems();
            }
            catch (err) {
                alert("Error adding item " + err.message);
                console.log(err);
            }
        }

        function loadFile() {
            const fileInput = document.getElementById("fileInput");
            if (!fileInput.files.length) return;

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = function (e) {
                const content = e.target.result;
                // Split file into lines and filter out empty lines
                const lines = content.split(/\r?\n/).filter(line => line.trim() !== "");

                library = new Library(); // Reset library

                lines.forEach(line => {
                    const parts = line.split("|");
                    const type = parts[0]; // BOOK or DVD

                    if (type === "BOOK") {
                        // Mapping parts: 0:Type, 1:ID, 2:Title, 3:Author, 4:Year, 5:Pages, 6:ISBN
                        const item = new Book(
                            parts[1],
                            parts[2],
                            parts[3],
                            Number(parts[4]),
                            Number(parts[5]),
                            parts[6]
                        );
                        library.addItem(item);
                    } else if (type === "DVD") {
                        // Mapping parts: 0:Type, 1:ID, 2:Title, 3:Author, 4:Year, 5:Duration
                        const item = new Dvd(
                            parts[1],
                            parts[2],
                            parts[3],
                            Number(parts[4]),
                            Number(parts[5])
                        );
                        library.addItem(item);
                    }
                });
                showItems();
            };

            reader.readAsText(file);
        }

        function download() {
            const items = library.getAllItems();
            // Convert items back into the Pipe-Separated format
            const lines = items.map(item => {
                if (item instanceof Book) {
                    return `BOOK|${item.id}|${item.title}|${item.author}|${item.year}|${item.pages}|${item.ISBN}`;
                } else {
                    return `DVD|${item.id}|${item.title}|${item.author}|${item.year}|${item.duration}`;
                }
            });

            const content = lines.join("\n");
            const blob = new Blob([content], { type: "text/plain" });
            const url = URL.createObjectURL(blob);

            const link = document.createElement("a");
            link.href = url;
            link.download = "library.txt";
            link.click();

            URL.revokeObjectURL(url);
        }

        function showItems() {
            const out = document.getElementById("output");
            out.innerHTML = "";
            const items = library.getAllItems();

            // Note: Fixed typo from 'lenght' to 'length'
            if (items.length === 0) {
                out.innerHTML = "(No items)";
                return;
            }

            items.forEach(item => {
                const div = document.createElement("div");
                div.textContent = item.getSummary();
                out.appendChild(div);
            });
        }
        //Expose functions to HTML buttons
        window.startPage = startPage;
        window.addItem = addItem;
        window.showItems = showItems;
        window.loadFile = loadFile;
        window.download = download;
        window.updateForm = updateForm;
    </script>
    <script src="01_librarySystem.js"></script>
</head>

<body onload="startPage()">
    <h1>Library system</h1>
    <hr>
    <h3>Upload files</h3>
    <input type="file" id="fileInput">
    <button onclick="loadFile()">load</button>
    <hr>
    <h3>Add Item</h3>
    <label>Type:</label>
    <select id="type" onchange="updateForm()">
        <option value="book">Book</option>
        <option value="dvd">DVD</option>
    </select>

    <br><br>
    <input id="id" placeholder="ID">
    <input id="title" placeholder="Title">
    <input id="author" placeholder="Author">
    <input id="year" placeholder="Year">

    <!--book-->
    <span id="book-fields">
        <input id="pages" type="number" placeholder="Pages">
        <input id="ISBN" placeholder="ISBN">
    </span>
    <!--DVD-->
    <span id="dvd-fields" style="display: none">
        <input id="duration" type="number" placeholder="Duration">
    </span>

    <br><br>
    <button onclick="addItem()">Add item</button>

    <hr>
    <h3>Items</h3>
    <button onclick="showItems()">Refresh</button>
    <div id="output" style="font-family:monospace"></div>

    <hr>
    <h3>Download</h3>
    <button onclick="download()">Download</button>

</body>

</html>
